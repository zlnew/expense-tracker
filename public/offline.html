<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7">
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14131b">
        <meta name="theme-color" content="#faf9f7">
        <title>Offline — Expense Tracker</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                background: light-dark(#faf9f7, #14131b);
                color: light-dark(#18181b, #f4f4f5);
            }
            .card {
                text-align: center;
                padding: 2rem;
                max-width: 24rem;
            }
            h1 {
                font-size: 1.25rem;
                margin: 0 0 0.5rem;
            }
            p {
                font-size: 0.9rem;
                line-height: 1.5;
                color: light-dark(#525252, #a3a3a3);
                margin: 0 0 1.5rem;
            }
            button {
                font: inherit;
                font-size: 0.9rem;
                padding: 0.6rem 1.25rem;
                border-radius: 0.5rem;
                border: 1px solid light-dark(#e5e5e5, #262626);
                background: light-dark(#ffffff, #171717);
                color: inherit;
                cursor: pointer;
            }
            button:hover {
                background: light-dark(#f5f5f5, #262626);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>You're offline</h1>
            <p>Check your connection and try again — your data is safe and will sync when you're back.</p>
            <button onclick="location.reload()">Try again</button>
        </div>
    </body>
</html>
