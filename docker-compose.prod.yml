# Production compose for Expense Tracker — used by the HorizonX agent.
# Builds the multi-stage Dockerfile.prod (php-fpm + nginx) and attaches to the
# shared personal-network so it can reach personal-postgres / personal-redis.
#
# Env overrides come from HorizonX env vars (written to .env in the workdir):
#   EXPENSE_PORT (default 8010), DB creds, APP_KEY, etc.
services:
  fpm:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: fpm
    image: ${APP_IMAGE:-expense-tracker:latest}
    container_name: ${APP_CONTAINER_NAME:-expense-tracker}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-personal-postgres}
      DB_PORT: '5432'
      DB_DATABASE: ${DB_DATABASE:-expense_tracker}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-personal-redis}
    restart: unless-stopped
    networks:
      - personal-network

  web:
    image: nginx:1.27-alpine
    container_name: ${APP_CONTAINER_NAME:-expense-tracker}-web
    depends_on:
      - fpm
    volumes_from:
      - fpm:ro
    ports:
      - '127.0.0.1:${EXPENSE_PORT:-8010}:80'
    restart: unless-stopped
    networks:
      - personal-network

networks:
  personal-network:
    external: true
