# Production compose for Expense Tracker — used by the HorizonX agent.
# The agent builds both services on deploy (`compose up -d --build`), tags the
# fpm image as APP_IMAGE=<appKey>:<commitHash> (rollback replays that tag), and
# recreates in place. Web is the Dockerfile.prod `web` stage (nginx + public/);
# its image name is fixed — the agent rebuilds it on every deploy, so it always
# matches the current build. On rollback the fpm code reverts; the static web
# assets may be one commit newer (acceptable for a personal app).
#
# Network isolation: fpm joins BOTH the project network (web → fpm) and the
# shared personal-network (fpm → personal-postgres / personal-redis). The web
# tier needs neither postgres nor redis, so it stays on the project network
# only — a compromised web container cannot reach the shared infra.
# Env overrides come from HorizonX env vars (written to .env):
#   EXPENSE_PORT (default 8010), DB creds, APP_KEY, etc.
services:
  fpm:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: fpm
    image: ${APP_IMAGE:-expense-tracker:latest}
    container_name: ${APP_CONTAINER_NAME:-expense-tracker}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-personal-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-expense_tracker}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-personal-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
    restart: unless-stopped
    networks:
      - default
      - personal-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: web
    image: expense-tracker-web:latest
    container_name: ${APP_CONTAINER_NAME:-expense-tracker}-web
    depends_on:
      - fpm
    ports:
      - '${APP_HOST}:${APP_PORT:-8000}:80'
    restart: unless-stopped
    networks:
      - default

networks:
  personal-network:
    external: true
