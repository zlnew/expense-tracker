services:
  fpm:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: fpm
    image: ${APP_IMAGE:-expense-tracker:latest}-fpm
    container_name: ${APP_CONTAINER_NAME:-expense-tracker}-fpm
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-personal-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-expense_tracker}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: ${REDIS_HOST:-personal-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
    restart: unless-stopped
    networks:
      - default
      - personal-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: web
    image: ${APP_IMAGE:-expense-tracker:latest}-web
    container_name: ${APP_CONTAINER_NAME:-expense-tracker}-web
    depends_on:
      - fpm
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:80'
    restart: unless-stopped
    networks:
      - default

networks:
  personal-network:
    external: true
