# Dev compose for Expense Tracker (Laravel 12 + Inertia/Vue 3).
# Uses docker/Dockerfile (php:8.4-cli + pdo_pgsql + composer) and runs
# `artisan serve`. First run: composer install, php artisan key:generate, migrate.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: expense-tracker:local
    container_name: expense-tracker
    working_dir: /app
    command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000']
    env_file:
      - path: .env
        required: false
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${EXPENSE_DB_HOST:-personal-postgres}
      DB_PORT: '5432'
      DB_DATABASE: ${EXPENSE_DB_DATABASE:-expense_tracker}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: ${EXPENSE_REDIS_HOST:-personal-redis}
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:${EXPENSE_PORT:-8000}:8000'
    restart: unless-stopped
    networks:
      - personal-network

networks:
  personal-network:
    external: true
