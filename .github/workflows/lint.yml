name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Run Pint
        run: composer lint:check

      - name: Format Frontend
        run: npm run format-check

      - name: Lint Frontend
        run: npm run lint-check

      - name: Build Frontend
        run: npm run build

      # Build first: the wayfinder Vite plugin generates resources/js/{routes,actions}
      # (gitignored) during build, and type-check needs those modules to exist.
      - name: Type-check Frontend
        run: npm run type-check

      - name: Test Backend
        run: php artisan test

      - name: Test Frontend Unit
        run: npm run test:unit

      - name: Check i18n Drift
        run: php artisan app:generate-language-files && git diff --exit-code resources/js/lang
